services:
  proxy:
    build:
      context: ..
      dockerfile: ops/proxy.Dockerfile
    env_file:
      - ../.env
    environment:
      ADMIN_DATA_PATH: /data/admin_overrides.json
      TRUST_PROXY: "true"
    volumes:
      - proxy_data:/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: ops/web.Dockerfile
    depends_on:
      proxy:
        condition: service_healthy
    expose:
      - "80"
    restart: unless-stopped

volumes:
  proxy_data:
